name: Build Football Game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Football Game
        run: npm run build

      - name: Save build files
        uses: actions/upload-artifact@v4
        with:
          name: football-game-web-build
          path: dist/
          
